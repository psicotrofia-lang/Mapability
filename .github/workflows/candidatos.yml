# Temporal: prepara la lista de centros candidatos y la guarda en la rama.
name: Centros candidatos

on:
  push:
    branches: [claude/project-thread-06fyxs]
    paths: [scripts/candidatos/candidatos.mjs, scripts/candidatos/atencion-temprana.tsv]

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/candidatos/candidatos.mjs
      - name: Guardar el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/candidatos/salida.json
          git commit -m "Centros candidatos: resultado" || exit 0
          git push
